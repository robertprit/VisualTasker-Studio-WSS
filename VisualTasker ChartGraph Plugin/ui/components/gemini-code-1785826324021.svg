                <circle cx="150" cy="2" r="10" class="primary shadow" />
            </g>
            <g id="Slider_Range" transform="translate(0, 50)">
                <rect width="300" height="4" rx="2" fill="#EADDFF" />
                <rect width="120" height="4" x="80" rx="2" class="primary" />
                <circle cx="80" cy="2" r="10" class="primary shadow" />
                <circle cx="200" cy="2" r="10" class="primary shadow" />
            </g>
        </g>

        <!-- Toolbars -->
        <g id="Toolbar_Group" transform="translate(0, 280)">
            <text x="0" y="0" class="text-label">Toolbars (Horizontal &amp; Vertical)</text>

            <!-- Bottom App Bar / Horizontal -->
            <g id="Toolbar_Horizontal" transform="translate(0, 15)" class="shadow">
                <rect width="360" height="80" fill="#F3EDF7" />
                <rect width="64" height="32" x="20" y="16" rx="16" class="primary-container" />
                <circle cx="52" cy="32" r="4" fill="#1D1B20" /> <!-- Dummy Icon -->
                <circle cx="132" cy="32" r="4" fill="#49454F" /> <!-- Dummy Icon -->
                <circle cx="212" cy="32" r="4" fill="#49454F" /> <!-- Dummy Icon -->
                <circle cx="292" cy="32" r="4" fill="#49454F" /> <!-- Dummy Icon -->
                <text x="52" y="64" text-anchor="middle" font-size="12" fill="#1D1B20" font-family="sans-serif">Tab 1</text>
            </g>

            <!-- Navigation Rail / Vertical -->
            <g id="Toolbar_Vertical" transform="translate(400, 15)" class="shadow">
                <rect width="80" height="300" fill="#F3EDF7" />
                <rect width="56" height="56" x="12" y="12" rx="16" class="primary-container" /> <!-- FAB in rail -->
                <rect width="56" height="32" x="12" y="80" rx="16" class="primary-container" />
                <text x="40" y="126" text-anchor="middle" font-size="12" fill="#1D1B20" font-family="sans-serif">Item</text>
            </g>
        </g>

        <!-- Timeline (Simple representation) -->
        <g id="Timeline_Group" transform="translate(0, 420)">
            <text x="0" y="0" class="text-label">Timeline Component</text>
            <g id="Timeline" transform="translate(0, 20)">
                <line x1="20" y1="10" x2="20" y2="120" stroke="#79747E" stroke-width="2" />
                <!-- Node 1 -->
                <circle cx="20" cy="20" r="8" class="primary" />
                <text x="40" y="24" class="text-primary">Step 1: Start</text>
                <!-- Node 2 -->
                <circle cx="20" cy="65" r="8" fill="#F4EFF4" stroke="#6750A4" stroke-width="2" />
                <text x="40" y="69" class="text-primary">Step 2: Processing</text>
                <!-- Node 3 -->
                <circle cx="20" cy="110" r="8" fill="#F4EFF4" stroke="#79747E" stroke-width="2" />
                <text x="40" y="114" fill="#79747E" font-family="Roboto, sans-serif" font-size="14">Step 3: Finish</text>
            </g>
        </g>

    </g>
</svg>
"""

with open("/mnt/data/material3_ui_kit.svg", "w") as f:
