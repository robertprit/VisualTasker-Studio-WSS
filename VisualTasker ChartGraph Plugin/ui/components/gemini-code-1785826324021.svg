                <path d="M27 21v6h-6v2h6v6h2v-6h6v-2h-6v-6h-2z" class="on-primary-container" />
            </g>
            <!-- Extended FAB -->
            <g id="FAB_Extended" transform="translate(70, 15)" class="shadow">
                <rect width="120" height="56" rx="16" class="primary-container" />
