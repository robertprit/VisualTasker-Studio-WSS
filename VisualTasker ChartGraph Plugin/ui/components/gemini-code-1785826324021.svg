                <circle cx="16" cy="16" r="8" fill="#79747E" />
            </g>
        </g>

        <!-- Checkboxes -->
        <g id="Checkbox_Group" transform="translate(200, 100)">
            <text x="0" y="0" class="text-label">Checkboxes</text>
            <g id="Checkbox_Checked" transform="translate(0, 15)">
                <rect width="18" height="18" rx="2" class="primary" />
                <path d="M7 13.4L3.6 10l1.4-1.4L7 10.6l7-7L15.4 5z" fill="#FEF7FF" />
            </g>
            <g id="Checkbox_Unchecked" transform="translate(40, 15)">
                <rect width="18" height="18" rx="2" fill="none" stroke="#49454F" stroke-width="2" />
            </g>
        </g>

        <!-- Radio Buttons -->
        <g id="RadioButton_Group" transform="translate(350, 100)">
            <text x="0" y="0" class="text-label">Radio Buttons</text>
            <g id="Radio_Selected" transform="translate(0, 15)">
                <circle cx="10" cy="10" r="10" class="primary" />
                <circle cx="10" cy="10" r="5" fill="#FEF7FF" />
            </g>
            <g id="Radio_Unselected" transform="translate(40, 15)">
                <circle cx="10" cy="10" r="9" fill="none" stroke="#49454F" stroke-width="2" />
            </g>
        </g>

        <!-- Sliders -->
        <g id="Slider_Group" transform="translate(0, 180)">
