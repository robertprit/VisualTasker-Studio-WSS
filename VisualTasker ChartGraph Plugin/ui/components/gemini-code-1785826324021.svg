                <text x="44" y="33" class="text-primary on-primary-container" font-weight="500">Create</text>
            </g>
        </g>

        <!-- Switches -->
        <g id="Switch_Group" transform="translate(0, 100)">
            <text x="0" y="0" class="text-label">Switches</text>
            <g id="Switch_On" transform="translate(0, 15)">
