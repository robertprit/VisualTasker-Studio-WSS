        <style>
            .surface { fill: #FEF7FF; }
            .primary { fill: #6750A4; }
            .primary-container { fill: #EADDFF; }
            .on-primary-container { fill: #21005D; }
            .outline { fill: none; stroke: #79747E; stroke-width: 2; }
            .text-primary { fill: #1D1B20; font-family: Roboto, sans-serif; font-size: 14px; }
            .text-label { fill: #49454F; font-family: Roboto, sans-serif; font-size: 12px; }
            .shadow { filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.25)); }
        </style>
    </defs>

    <rect width="1000" height="800" fill="#F4EFF4" />
