        <text x="180" y="320" text-anchor="middle" class="text-label" opacity="0.5">Arbeitsbereich (360x640)</text>
    </g>

    <!-- UI Elements Palette -->
    <g id="Palette" transform="translate(450, 100)">

        <!-- FABs -->
        <g id="FAB_Group" transform="translate(0, 0)">
            <text x="0" y="0" class="text-label">Floating Action Buttons (FAB)</text>
