<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">VisualTasker Blockeditor: Blocks, Reporter and Connection Points</title>
  <desc id="desc">Summary of the currently available DefaultBlockRegistry blocks, runtime variable reporters, BlockDesignFactory vision blueprint, reporter assets and connection point kinds used by the app.</desc>
  <defs>
    <style>
      .bg { fill: #101417; }
      .panel { fill: #171D21; stroke: #2A343A; stroke-width: 1.5; }
      .subpanel { fill: #1D252A; stroke: #334047; stroke-width: 1; }
      .title { fill: #F1F5F2; font: 700 34px Inter, Roboto, Arial, sans-serif; }
      .subtitle { fill: #B9C5C0; font: 500 16px Inter, Roboto, Arial, sans-serif; }
      .section { fill: #ECF2EE; font: 700 22px Inter, Roboto, Arial, sans-serif; }
      .label { fill: #F4F7F5; font: 700 15px Inter, Roboto, Arial, sans-serif; }
      .small { fill: #B9C5C0; font: 500 12px Inter, Roboto, Arial, sans-serif; }
      .tiny { fill: #8FA09A; font: 500 10px Inter, Roboto, Arial, sans-serif; }
      .code { fill: #DDE7E2; font: 500 12px "JetBrains Mono", "Roboto Mono", monospace; }
      .muted { fill: #81918B; font: 500 12px Inter, Roboto, Arial, sans-serif; }
      .chipText { fill: #F7FAF8; font: 700 11px Inter, Roboto, Arial, sans-serif; }
      .strokeSoft { stroke: #425158; stroke-width: 1.2; }
      .connector { fill: #F1C96A; stroke: #2B2514; stroke-width: 1; }
      .valueSocket { fill: #0E1518; stroke: #F1C96A; stroke-width: 2; }
      .operatorDock { fill: #18262B; stroke: #DDE7E2; stroke-width: 1.8; opacity: 0.86; }
      .statementSlot { fill: none; stroke: #DDE7E2; stroke-width: 2; stroke-dasharray: 8 6; }
      .arrow { stroke: #D9E2DE; stroke-width: 2; fill: none; marker-end: url(#arrowHead); }
      .dashArrow { stroke: #8FA09A; stroke-width: 1.6; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowHeadMuted); }
    </style>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9E2DE"/>
    </marker>
    <marker id="arrowHeadMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA09A"/>
    </marker>
    <linearGradient id="surfaceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E272C"/>
      <stop offset="100%" stop-color="#12181B"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <path id="shapeStatement" d="M 14 0 L 20 0 C 26 0 26 8 32 8 C 38 8 38 0 44 0 L 286 0 Q 300 0 300 14 L 300 46 Q 300 60 286 60 L 162 60 C 156 60 156 52 150 52 C 144 52 144 60 138 60 L 14 60 Q 0 60 0 46 L 0 14 Q 0 0 14 0 Z"/>
    <path id="shapeStart" d="M 14 0 L 286 0 Q 300 0 300 14 L 300 46 Q 300 60 286 60 L 162 60 C 156 60 156 52 150 52 C 144 52 144 60 138 60 L 14 60 Q 0 60 0 46 L 0 14 Q 0 0 14 0 Z"/>
    <path id="shapeContainer" d="M 14 0 L 20 0 C 26 0 26 8 32 8 C 38 8 38 0 44 0 L 286 0 Q 300 0 300 14 L 300 46 Q 300 60 286 60 L 52 60 Q 32 60 32 80 L 32 132 Q 32 152 52 152 L 286 152 Q 300 152 300 166 L 300 206 Q 300 220 286 220 L 162 220 C 156 220 156 212 150 212 C 144 212 144 220 138 220 L 14 220 Q 0 220 0 206 L 0 14 Q 0 0 14 0 Z"/>
    <path id="shapeContainerBranches" d="M 14 0 L 20 0 C 26 0 26 8 32 8 C 38 8 38 0 44 0 L 286 0 Q 300 0 300 14 L 300 44 Q 300 58 286 58 L 52 58 Q 32 58 32 78 L 32 112 Q 32 132 52 132 L 288 132 Q 306 144 288 156 L 52 156 Q 32 156 32 176 L 32 210 Q 32 230 52 230 L 288 230 Q 306 242 288 254 L 52 254 Q 32 254 32 274 L 32 304 Q 32 324 52 324 L 286 324 Q 300 324 300 338 L 300 374 Q 300 388 286 388 L 162 388 C 156 388 156 380 150 380 C 144 380 144 388 138 388 L 14 388 Q 0 388 0 374 L 0 14 Q 0 0 14 0 Z"/>
    <path id="shapeReporter" d="M 13 0 L 61 0 A 13 13 0 0 1 74 13 L 74 27 A 13 13 0 0 1 61 40 L 13 40 A 13 13 0 0 1 0 27 L 0 13 A 13 13 0 0 1 13 0 Z"/>
    <path id="shapeInlineReporter" d="M 17 0 L 208 0 A 10 10 0 0 1 218 10 L 218 30 A 10 10 0 0 1 208 40 L 17 40 A 10 10 0 0 1 7 30 L 7 32 C 7 26 3.5 26 0 20 C 3.5 14 7 14 7 8 L 7 10 A 10 10 0 0 1 17 0 Z"/>
  </defs>

  <rect class="bg" width="1800" height="1320"/>
  <rect x="28" y="28" width="1744" height="1264" rx="18" fill="url(#surfaceGrad)" stroke="#2F3B41" stroke-width="1.5"/>

  <text x="64" y="82" class="title">VisualTasker Blockeditor: Blocks, Reporter, Verbindungspunkte</text>
  <text x="64" y="112" class="subtitle">Stand aus DefaultBlockRegistry, Runtime-Variable-Reportern, BlockDesignFactory und den aktuell verwendeten Compose-Shape-Konstanten.</text>
  <text x="1420" y="82" class="small">Projekt: VisualTaskerStudio-WSS</text>
  <text x="1420" y="106" class="tiny">Artefakt, kein App-Code</text>

  <rect x="64" y="150" width="1672" height="265" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="92" y="190" class="section">1. Darstellungsformen</text>

  <g transform="translate(96,220)">
    <use href="#shapeStart" fill="#B78B00" stroke="#F1C96A" stroke-width="1.4"/>
    <circle cx="150" cy="60" r="7" class="connector"/>
    <text x="18" y="25" class="label">Start/Event</text>
    <text x="18" y="45" class="small">kein Previous, nur Next</text>
    <text x="108" y="88" class="tiny">Next-Tab</text>
  </g>

  <g transform="translate(430,220)">
    <use href="#shapeStatement" fill="#3E6F91" stroke="#79A9C8" stroke-width="1.4"/>
    <circle cx="32" cy="0" r="7" class="connector"/>
    <circle cx="150" cy="60" r="7" class="connector"/>
    <text x="18" y="25" class="label">Statement</text>
    <text x="18" y="45" class="small">Previous + Next</text>
    <text x="46" y="-12" class="tiny">Previous-Notch</text>
    <text x="108" y="88" class="tiny">Next-Tab</text>
  </g>

  <g transform="translate(764,180)">
    <use href="#shapeContainer" fill="#87684A" stroke="#C7A47F" stroke-width="1.4"/>
    <rect x="44" y="82" width="236" height="48" rx="8" class="statementSlot"/>
    <circle cx="32" cy="0" r="7" class="connector"/>
    <circle cx="150" cy="220" r="7" class="connector"/>
    <text x="18" y="25" class="label">Container/C-Block</text>
    <text x="18" y="45" class="small">StatementInput innen</text>
    <text x="60" y="111" class="small">DO / BODY / THEN / ELSE</text>
  </g>

  <g transform="translate(1120,215)">
    <use href="#shapeReporter" fill="#5A716B" stroke="#93B2AA" stroke-width="1.4"/>
    <circle cx="0" cy="20" r="7" class="connector"/>
    <text x="22" y="25" class="label">Reporter</text>
    <text x="0" y="65" class="tiny">Output links</text>
  </g>

  <g transform="translate(1370,205)">
    <use href="#shapeInlineReporter" fill="#586E4B" stroke="#91B282" stroke-width="1.4"/>
    <circle cx="0" cy="30" r="7" class="connector"/>
    <rect x="25" y="0" width="74" height="40" rx="20" class="operatorDock"/>
    <rect x="137" y="0" width="74" height="40" rx="20" class="operatorDock"/>
    <text x="54" y="25" class="label">A</text>
    <text x="121" y="25" class="label">op</text>
    <text x="166" y="25" class="label">B</text>
    <text x="0" y="80" class="tiny">InlineReporter: Output links + sichtbare A/B-Dockzonen</text>
  </g>

  <rect x="64" y="445" width="1060" height="585" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="92" y="485" class="section">2. Aktuelle Default-Blöcke und Reporter</text>
  <text x="92" y="512" class="small">20 Definitionen aus DefaultBlockRegistry. Reporter haben keinen Previous/Next-Anschluss, sondern einen Output-Anschluss.</text>

  <g transform="translate(92,542)">
    <text x="0" y="0" class="label">Event</text>
    <rect x="0" y="14" width="450" height="38" rx="8" fill="#B78B00"/><text x="16" y="38" class="label">event.start</text><text x="210" y="38" class="small">Script Start | next</text>

    <text x="0" y="86" class="label">Action</text>
    <rect x="0" y="100" width="450" height="38" rx="8" fill="#3E6F91"/><text x="16" y="124" class="label">action.clickText</text><text x="210" y="124" class="small">Text</text>
    <rect x="0" y="146" width="450" height="38" rx="8" fill="#3E6F91"/><text x="16" y="170" class="label">action.wait</text><text x="210" y="170" class="small">ms: TIMEOUT_MS</text>
    <rect x="0" y="192" width="450" height="52" rx="8" fill="#3E6F91"/><text x="16" y="216" class="label">action.findTemplate</text><text x="210" y="216" class="small">image, threshold, timeout, retry, region</text>

    <text x="0" y="278" class="label">Debug</text>
    <rect x="0" y="292" width="450" height="38" rx="8" fill="#75617A"/><text x="16" y="316" class="label">debug.log</text><text x="210" y="316" class="small">message</text>

    <text x="0" y="364" class="label">Variable</text>
    <rect x="0" y="378" width="450" height="38" rx="8" fill="#5A716B"/><text x="16" y="402" class="label">variable.get</text><text x="210" y="402" class="small">Reporter Any</text>
    <rect x="0" y="424" width="450" height="38" rx="8" fill="#5A716B"/><text x="16" y="448" class="label">variable.set</text><text x="210" y="448" class="small">Statement | var, value</text>
  </g>

  <g transform="translate(570,542)">
    <text x="0" y="0" class="label">Control</text>
    <use href="#shapeContainer" transform="translate(0,14) scale(1.35,0.26)" fill="#87684A" stroke="#C7A47F"/><text x="16" y="45" class="label">control.repeat</text><text x="210" y="45" class="small">StatementInput DO</text>
    <use href="#shapeContainer" transform="translate(0,70) scale(1.35,0.26)" fill="#87684A" stroke="#C7A47F"/><text x="16" y="101" class="label">control.while</text><text x="210" y="101" class="small">Value CONDITION:Boolean + BODY</text>
    <use href="#shapeContainer" transform="translate(0,126) scale(1.35,0.26)" fill="#87684A" stroke="#C7A47F"/><text x="16" y="157" class="label">control.if</text><text x="210" y="157" class="small">Value CONDITION:Boolean + THEN</text>
    <use href="#shapeContainer" transform="translate(0,182) scale(1.35,0.26)" fill="#87684A" stroke="#C7A47F"/><text x="16" y="213" class="label">control.ifElse</text><text x="210" y="213" class="small">THEN + ELSE</text>
    <use href="#shapeContainerBranches" transform="translate(0,238) scale(1.35,0.16)" fill="#87684A" stroke="#C7A47F"/><text x="16" y="269" class="label">control.ifElseIfElse</text><text x="210" y="269" class="small">CONDITION + ELIF_CONDITION | THEN/ELIF/ELSE</text>

    <text x="0" y="340" class="label">Logic / Reporter</text>
    <rect x="0" y="354" width="514" height="158" rx="8" class="subpanel"/>
    <text x="16" y="380" class="code">logic.screenContains</text><text x="210" y="380" class="small">Boolean | field Text</text>
    <text x="16" y="404" class="code">logic.boolean</text><text x="210" y="404" class="small">Boolean compact</text>
    <text x="16" y="428" class="code">logic.and / logic.or</text><text x="210" y="428" class="small">Boolean | Value A,B:Boolean</text>
    <text x="16" y="452" class="code">logic.operate</text><text x="210" y="452" class="small">Any inline | Input1/Input2</text>
    <text x="16" y="476" class="code">logic.compare</text><text x="210" y="476" class="small">Boolean inline | LEFT/RIGHT</text>
    <text x="16" y="500" class="code">literal.number/string/boolean</text><text x="250" y="500" class="small">Number, Text, Boolean</text>
  </g>

  <rect x="1152" y="445" width="584" height="585" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="1180" y="485" class="section">3. Reporter-Familien und Assets</text>
  <text x="1180" y="512" class="small">ReporterVisualMode: COMPACT oder DETAILED. Boolean bleibt kompakt.</text>

  <g transform="translate(1180,540)">
    <use href="#shapeReporter" fill="#5A716B" stroke="#93B2AA"/><text x="14" y="25" class="label">STR</text><text x="112" y="25" class="code">reporter-string-small.svg</text>
    <use href="#shapeReporter" transform="translate(0,58)" fill="#586E4B" stroke="#91B282"/><text x="14" y="83" class="label">NUM</text><text x="112" y="83" class="code">reporter-num.small.svg</text>
    <use href="#shapeReporter" transform="translate(0,116)" fill="#66707A" stroke="#A6B1BC"/><text x="14" y="141" class="label">ANY</text><text x="112" y="141" class="code">reporter-any.small.svg</text>
    <use href="#shapeReporter" transform="translate(0,174)" fill="#6D607E" stroke="#AD9CC6"/><text x="14" y="199" class="label">CST</text><text x="112" y="199" class="code">reporter-custom.small.svg</text>
    <use href="#shapeReporter" transform="translate(0,232)" fill="#75617A" stroke="#C2A0C9"/><text x="14" y="257" class="label">BOOL</text><text x="112" y="257" class="code">reporter-bool-small.true/false.svg</text>

    <use href="#shapeInlineReporter" transform="translate(0,320)" fill="#586E4B" stroke="#91B282"/>
    <rect x="25" y="320" width="74" height="40" rx="20" class="operatorDock"/>
    <rect x="137" y="320" width="74" height="40" rx="20" class="operatorDock"/>
    <text x="104" y="345" class="label">OP</text><text x="250" y="345" class="code">Reporter-Operator-*.svg</text>
    <text x="250" y="367" class="small">Dockzonen, keine runden Ausschnitte</text>
    <text x="0" y="410" class="small">Genutzt fuer inputsInline: logic.operate, logic.compare und custom inline reporter.</text>
    <text x="0" y="448" class="label">Runtime-Reporter</text>
    <text x="0" y="474" class="code">variable.reporter.&lt;variableId&gt;</text>
    <text x="0" y="498" class="small">wird aus VariableReporterFactory erzeugt, OutputType = Variablentyp oder Any</text>
  </g>

  <rect x="64" y="1060" width="808" height="190" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="92" y="1100" class="section">4. Verbindungspunkte</text>
  <g transform="translate(92,1124)">
    <circle cx="18" cy="20" r="9" class="connector"/><text x="42" y="25" class="label">Previous</text><text x="170" y="25" class="small">oberer Stack-Socket: nimmt Next eines vorherigen Statements an</text>
    <circle cx="18" cy="58" r="9" class="connector"/><text x="42" y="63" class="label">Next</text><text x="170" y="63" class="small">unterer Stack-Tab: verbindet zum Previous des naechsten Statements</text>
    <circle cx="18" cy="96" r="9" class="connector"/><text x="42" y="101" class="label">Output</text><text x="170" y="101" class="small">Reporter-Ausgang, provides/accepts den OutputType</text>
    <rect x="9" y="126" width="18" height="18" rx="5" class="valueSocket"/><text x="42" y="140" class="label">ValueInput</text><text x="170" y="140" class="small">parametrisierter Input mit accepts: Boolean, Number, Text, Any, Region, Image, Duration...</text>
  </g>

  <rect x="900" y="1060" width="836" height="190" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="928" y="1100" class="section">5. Erweiterbare/factory-basierte Blöcke</text>
  <text x="928" y="1130" class="small">BlockDesignFactory erzeugt eigene BlockDefinitionen mit custom.*-IDs oder explizitem Typ.</text>
  <g transform="translate(928,1152)">
    <rect x="0" y="0" width="380" height="44" rx="8" fill="#3F735F"/><text x="16" y="28" class="label">vision.findTemplate</text><text x="190" y="28" class="small">Factory-Blueprint</text>
    <path class="dashArrow" d="M 396 22 C 470 22 470 78 548 78"/>
    <rect x="562" y="48" width="246" height="60" rx="8" class="subpanel"/>
    <text x="578" y="74" class="code">TemplateImage</text>
    <text x="578" y="96" class="code">ScreenRegion</text>
    <text x="0" y="82" class="small">Inputs: image, threshold, timeout, retry, region</text>
  </g>

  <g transform="translate(64,1268)">
    <text class="tiny" x="0" y="0">Quellen im Projekt: DefaultBlockRegistry.kt, BlockDefinition.kt, ReporterVisualMode.kt, BlockShapes.kt, LayoutModels.kt, LayoutConstants.kt, BlockDesignFactory.kt.</text>
  </g>
</svg>
