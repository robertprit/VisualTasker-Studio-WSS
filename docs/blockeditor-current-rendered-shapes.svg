<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">VisualTasker Blockeditor: Current Rendered Legacy Shapes</title>
  <desc id="desc">SVG reconstruction of the current app block shapes from BlockShapes.kt, BlockPathCache.kt, ContainerBranchLayout.kt and LayoutConstants.kt.</desc>
  <defs>
    <style>
      .bg { fill: #101417; }
      .panel { fill: #171D21; stroke: #2A343A; stroke-width: 1.5; }
      .subpanel { fill: #1D252A; stroke: #334047; stroke-width: 1; }
      .title { fill: #F1F5F2; font: 700 34px Inter, Roboto, Arial, sans-serif; }
      .subtitle { fill: #B9C5C0; font: 500 16px Inter, Roboto, Arial, sans-serif; }
      .section { fill: #ECF2EE; font: 700 22px Inter, Roboto, Arial, sans-serif; }
      .label { fill: #F4F7F5; font: 700 15px Inter, Roboto, Arial, sans-serif; }
      .small { fill: #B9C5C0; font: 500 12px Inter, Roboto, Arial, sans-serif; }
      .tiny { fill: #8FA09A; font: 500 10px Inter, Roboto, Arial, sans-serif; }
      .code { fill: #DDE7E2; font: 500 12px "JetBrains Mono", "Roboto Mono", monospace; }
      .muted { fill: #81918B; font: 500 12px Inter, Roboto, Arial, sans-serif; }
      .slot { fill: rgba(16,20,23,0.42); stroke: #DDE7E2; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .valueSocket { fill: #0E1518; stroke: #F1C96A; stroke-width: 2; }
      .operatorDock { fill: #18262B; stroke: #DDE7E2; stroke-width: 1.8; opacity: 0.86; }
      .anchor { fill: #F1C96A; stroke: #2B2514; stroke-width: 1.2; }
      .outline { fill: none; stroke: #DDE7E2; stroke-width: 1.4; stroke-dasharray: 8 6; opacity: 0.5; }
      .selectedOutline { fill: none; stroke: #48C7FF; stroke-width: 3; }
      .line { stroke: #8FA09A; stroke-width: 1.4; fill: none; }
    </style>
    <filter id="shadow" x="-10%" y="-14%" width="120%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Exact SVG reconstructions of BlockShapes.kt with current Legacy renderer defaults:
         CORNER=12, REPORTER_RADIUS=13, INLINE_REPORTER_RADIUS=10,
         NOTCH_WIDTH=24, NOTCH_DEPTH=7, TAB_WIDTH=24, TAB_DEPTH=7,
         NESTED_INDENT=32, HEADER_HEIGHT=44, FOOTER_HEIGHT=24,
         STATEMENT_MIN_HEIGHT=48, SLOT_PADDING=8, BRANCH_SHELF=44. -->
    <path id="legacyStart_288x64" d="M 12 0 L 276 0 A 12 12 0 0 1 288 12 L 288 52 A 12 12 0 0 1 276 64 L 156 64 C 150 64 150 57 144 57 C 138 57 138 64 132 64 L 12 64 A 12 12 0 0 1 0 52 L 0 12 A 12 12 0 0 1 12 0 Z"/>
    <path id="legacyStatement_288x60" d="M 12 0 L 20 0 C 26 0 26 7 32 7 C 38 7 38 0 44 0 L 276 0 A 12 12 0 0 1 288 12 L 288 48 A 12 12 0 0 1 276 60 L 156 60 C 150 60 150 53 144 53 C 138 53 138 60 132 60 L 12 60 A 12 12 0 0 1 0 48 L 0 12 A 12 12 0 0 1 12 0 Z"/>
    <path id="legacyContainer_repeat_288x132" d="M 12 0 L 20 0 C 26 0 26 7 32 7 C 38 7 38 0 44 0 L 276 0 A 12 12 0 0 1 288 12 L 288 32 A 12 12 0 0 1 276 44 L 44 44 A 12 12 0 0 0 32 56 L 32 96 A 12 12 0 0 0 44 84 L 276 108 A 12 12 0 0 1 288 120 L 288 120 A 12 12 0 0 1 276 132 L 156 132 C 150 132 150 125 144 125 C 138 125 138 132 132 132 L 12 132 A 12 12 0 0 1 0 120 L 0 12 A 12 12 0 0 1 12 0 Z"/>
    <g id="displayContainer_ifElse_288x244">
      <path d="M 12 0 L 20 0 C 26 0 26 7 32 7 C 38 7 38 0 44 0 L 276 0 A 12 12 0 0 1 288 12 L 288 32 A 12 12 0 0 1 276 44 L 32 44 L 32 104 C 50 104 50 128 32 128 L 32 220 L 132 220 C 138 220 138 227 144 227 C 150 227 150 220 156 220 L 276 220 A 12 12 0 0 1 288 232 A 12 12 0 0 1 276 244 L 12 244 A 12 12 0 0 1 0 232 L 0 12 A 12 12 0 0 1 12 0 Z"/>
      <rect x="32" y="84" width="256" height="24" rx="12"/>
      <rect x="32" y="132" width="256" height="24" rx="12"/>
      <rect x="32" y="220" width="256" height="24" rx="12"/>
    </g>
    <g id="displayContainer_ifElseIfElse_288x360">
      <path d="M 12 0 L 20 0 C 26 0 26 7 32 7 C 38 7 38 0 44 0 L 276 0 A 12 12 0 0 1 288 12 L 288 32 A 12 12 0 0 1 276 44 L 32 44 L 32 104 C 50 104 50 128 32 128 L 32 220 C 50 220 50 244 32 244 L 32 336 L 132 336 C 138 336 138 343 144 343 C 150 343 150 336 156 336 L 276 336 A 12 12 0 0 1 288 348 A 12 12 0 0 1 276 360 L 12 360 A 12 12 0 0 1 0 348 L 0 12 A 12 12 0 0 1 12 0 Z"/>
      <rect x="32" y="84" width="256" height="24" rx="12"/>
      <rect x="32" y="132" width="256" height="24" rx="12"/>
      <rect x="32" y="220" width="256" height="24" rx="12"/>
      <rect x="32" y="336" width="256" height="24" rx="12"/>
    </g>
    <path id="legacyReporter_74x40" d="M 13 0 L 61 0 A 13 13 0 0 1 74 13 L 74 27 A 13 13 0 0 1 61 40 L 13 40 A 13 13 0 0 1 0 27 L 0 13 A 13 13 0 0 1 13 0 Z"/>
    <path id="legacyInlineReporter_218x40" d="M 17 0 L 208 0 A 10 10 0 0 1 218 10 L 218 30 A 10 10 0 0 1 208 40 L 17 40 A 10 10 0 0 1 7 30 L 7 32 C 7 26 3.5 26 0 20 C 3.5 14 7 14 7 8 L 7 10 A 10 10 0 0 1 17 0 Z"/>
  </defs>

  <rect class="bg" width="1800" height="1320"/>
  <rect x="28" y="28" width="1744" height="1264" rx="18" fill="#12181B" stroke="#2F3B41" stroke-width="1.5"/>

  <text x="64" y="82" class="title">VisualTasker Blockeditor: aktuelle gerenderte Shapes</text>
  <text x="64" y="112" class="subtitle">Display-nahe Rekonstruktion: Default-Blöcke plus Control-Block-Darstellung nach Screenshot; Cyan ist nur Selection-Overlay.</text>
  <text x="1410" y="82" class="small">Renderer: `BlockVisualPathProvider.Legacy`</text>
  <text x="1410" y="106" class="tiny">Stand: aktueller Workspace-Shell-Startpunkt</text>

  <rect x="64" y="150" width="1672" height="430" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="92" y="190" class="section">1. Shape-Familien, wie sie im App-Renderer entstehen</text>

  <g transform="translate(96,230)">
    <use href="#legacyStart_288x64" fill="#B78B00" stroke="#3A2B08" stroke-width="2"/>
    <circle cx="144" cy="64" r="8" class="anchor"/>
    <text x="16" y="28" class="label">event.start</text>
    <text x="16" y="48" class="small">startStatementPath(288 x 64)</text>
    <text x="0" y="96" class="tiny">Kein oberer Socket, unterer Next-Tab bei x=144</text>
  </g>

  <g transform="translate(430,230)">
    <use href="#legacyStatement_288x60" fill="#3E6F91" stroke="#0E2738" stroke-width="2"/>
    <circle cx="32" cy="7" r="8" class="anchor"/>
    <circle cx="144" cy="60" r="8" class="anchor"/>
    <text x="16" y="28" class="label">Statement</text>
    <text x="16" y="48" class="small">statementPath(288 x 60)</text>
    <text x="0" y="94" class="tiny">Top-Notch bei NESTED_INDENT=32, Next-Tab bei Mitte</text>
  </g>

  <g transform="translate(764,198)">
    <use href="#legacyContainer_repeat_288x132" fill="#87684A" stroke="#382815" stroke-width="2"/>
    <rect x="40" y="58" width="220" height="40" rx="6" class="slot"/>
    <circle cx="32" cy="7" r="8" class="anchor"/>
    <circle cx="144" cy="132" r="8" class="anchor"/>
    <text x="16" y="28" class="label">control.repeat</text>
    <text x="16" y="48" class="small">containerPath(288 x 132), 1 Slot</text>
    <text x="55" y="83" class="small">DO</text>
    <text x="0" y="166" class="tiny">BranchDividerYs = []</text>
  </g>

  <g transform="translate(1098,170)">
    <use href="#displayContainer_ifElse_288x244" fill="#5D3A50" stroke="#2A1C26" stroke-width="2"/>
    <use href="#displayContainer_ifElse_288x244" class="selectedOutline"/>
    <rect x="40" y="58" width="220" height="40" rx="6" class="slot"/>
    <rect x="40" y="146" width="220" height="54" rx="6" class="slot"/>
    <circle cx="32" cy="7" r="8" class="anchor"/>
    <circle cx="144" cy="244" r="8" class="anchor"/>
    <text x="16" y="28" class="label">control.ifElse</text>
    <text x="16" y="48" class="small">Displayform: Spine + THEN/ELSE-Bars</text>
    <text x="55" y="83" class="small">THEN</text>
    <text x="55" y="175" class="small">ELSE</text>
    <text x="0" y="276" class="tiny">Cyan = Auswahlkontur; ELSE bleibt separater Divider</text>
  </g>

  <g transform="translate(1432,142)">
    <use href="#displayContainer_ifElseIfElse_288x360" fill="#5D3A50" stroke="#2A1C26" stroke-width="2"/>
    <use href="#displayContainer_ifElseIfElse_288x360" class="selectedOutline"/>
    <rect x="40" y="58" width="220" height="40" rx="6" class="slot"/>
    <rect x="40" y="146" width="220" height="58" rx="6" class="slot"/>
    <rect x="40" y="262" width="220" height="54" rx="6" class="slot"/>
    <circle cx="32" cy="7" r="8" class="anchor"/>
    <circle cx="144" cy="360" r="8" class="anchor"/>
    <text x="16" y="28" class="label">control.ifElseIfElse</text>
    <text x="16" y="48" class="small">Displayform: Spine + IF/ELSEIF/ELSE-Bars</text>
    <text x="55" y="83" class="small">THEN</text>
    <text x="55" y="175" class="small">ELIF</text>
    <text x="55" y="291" class="small">ELSE</text>
    <text x="0" y="392" class="tiny">Cyan = Auswahlkontur; `elseif` ist nur noch eine Condition-Section</text>
  </g>

  <rect x="64" y="612" width="820" height="350" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="92" y="652" class="section">2. Reporterformen</text>
  <text x="92" y="680" class="small">`reporterPath` nutzt RoundRect mit Radius min(13, h/2, w/2). Inline-Reporter nutzt den linken Output-Tab aus `inlineReporterPath`.</text>

  <g transform="translate(96,720)">
    <use href="#legacyReporter_74x40" fill="#586E4B" stroke="#1F2D1B" stroke-width="2"/>
    <circle cx="0" cy="20" r="8" class="anchor"/>
    <text x="22" y="25" class="label">Number</text>
    <text x="112" y="25" class="code">literal.number</text>

    <use href="#legacyReporter_74x40" transform="translate(0,66)" fill="#5A716B" stroke="#20332F" stroke-width="2"/>
    <circle cx="0" cy="86" r="8" class="anchor"/>
    <text x="22" y="91" class="label">Text</text>
    <text x="112" y="91" class="code">literal.string</text>

    <use href="#legacyReporter_74x40" transform="translate(0,132)" fill="#6D607E" stroke="#30253C" stroke-width="2"/>
    <circle cx="0" cy="152" r="8" class="anchor"/>
    <text x="22" y="157" class="label">Any / Variable</text>
    <text x="112" y="157" class="code">variable.get, variable.reporter.&lt;id&gt;</text>

    <use href="#legacyInlineReporter_218x40" transform="translate(0,210)" fill="#586E4B" stroke="#1F2D1B" stroke-width="2"/>
    <rect x="25" y="210" width="74" height="40" rx="20" class="operatorDock"/>
    <rect x="137" y="210" width="74" height="40" rx="20" class="operatorDock"/>
    <circle cx="0" cy="230" r="8" class="anchor"/>
    <text x="121" y="235" text-anchor="middle" class="label">op</text>
    <text x="250" y="235" class="code">logic.operate, logic.compare</text>
    <text x="250" y="257" class="small">A/B-Dockflächen, keine ausgeschnittenen Löcher</text>
  </g>

  <rect x="916" y="612" width="820" height="350" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="944" y="652" class="section">3. Verbindungspunkte im aktuellen Modell</text>
  <text x="944" y="680" class="small">Erzeugt in `BlockDefinition.createNode()`, indexiert als `ConnectionAnchor` im Layout.</text>

  <g transform="translate(944,720)">
    <circle cx="18" cy="20" r="9" class="anchor"/><text x="44" y="25" class="label">Previous</text><text x="190" y="25" class="small">`${blockId}:previous`, kind `ConnectionKind.Previous`</text>
    <circle cx="18" cy="64" r="9" class="anchor"/><text x="44" y="69" class="label">Next</text><text x="190" y="69" class="small">`${blockId}:next`, kind `ConnectionKind.Next`</text>
    <circle cx="18" cy="108" r="9" class="anchor"/><text x="44" y="113" class="label">Output</text><text x="190" y="113" class="small">`${blockId}:output`, kind `ConnectionKind.Output`, provides OutputType</text>
    <rect x="9" y="144" width="18" height="18" rx="5" class="valueSocket"/><text x="44" y="158" class="label">ValueInput</text><text x="190" y="158" class="small">`${blockId}:&lt;input&gt;`, accepts z.B. Boolean, Number, Any, Image, Region</text>
    <rect x="9" y="186" width="18" height="18" rx="5" class="slot"/><text x="44" y="201" class="label">StatementInput</text><text x="190" y="201" class="small">`${blockId}:&lt;slot&gt;:stmt`, Slotnamen DO, BODY, THEN, ELIF, ELSE</text>
    <line x1="0" y1="242" x2="760" y2="242" class="line"/>
    <text x="0" y="274" class="tiny">Anchors sind hier sichtbar hervorgehoben. In der App werden Anschlusspunkte je nach Layer/Interaktion anders betont, die Pfadgeometrie bleibt aber diese.</text>
  </g>

  <rect x="64" y="996" width="1672" height="230" rx="12" class="panel" filter="url(#shadow)"/>
  <text x="92" y="1036" class="section">4. Aktuelle Definitionen, die diese Shapes benutzen</text>

  <g transform="translate(92,1072)">
    <text x="0" y="0" class="label">Start/Event</text>
    <text x="0" y="26" class="code">event.start</text>

    <text x="260" y="0" class="label">Statements</text>
    <text x="260" y="26" class="code">action.clickText, action.wait, action.findTemplate, debug.log, variable.set</text>

    <text x="260" y="70" class="label">Container/Condition</text>
    <text x="260" y="96" class="code">control.repeat, control.while, control.if, control.ifElse, control.ifElseIfElse</text>

    <text x="0" y="70" class="label">Reporter</text>
    <text x="0" y="96" class="code">logic.screenContains, logic.boolean, logic.and, logic.or</text>
    <text x="0" y="120" class="code">logic.operate, logic.compare, literal.number, literal.string, literal.boolean</text>
    <text x="0" y="144" class="code">variable.get, variable.reporter.&lt;variableId&gt;</text>

    <text x="1020" y="0" class="label">Factory/Custom</text>
    <text x="1020" y="26" class="code">vision.findTemplate</text>
    <text x="1020" y="50" class="code">custom.*</text>
    <text x="1020" y="82" class="small">BlockDesignFactory kann eigene Definitions mit `svgPath`, ValueInputs, StatementInputs und PortHandles erzeugen.</text>
  </g>

  <text x="64" y="1272" class="tiny">Quellen: Screenshot /tmp/codex-clipboard-4c72b803-8e9b-49c3-8ceb-bcfe0fb818b3.png, BlockShapes.kt, BlockPathCache.kt, BlockRenderer.kt, BlockEditorScaffold.kt, LayoutConstants.kt, ContainerBranchLayout.kt, BlockDefinition.kt, DefaultBlockRegistry.kt.</text>
</svg>
